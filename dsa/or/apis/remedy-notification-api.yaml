apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: remedy-notification-api
  description: API for handling remedy notifications with automatic email integration
  tags:
    - notifications
    - email
    - remedy
    - postie
  links:
    - url: <url>
      title: API Documentation
      icon: docs
    - url: <url>
      title: Remedy Notification Endpoint
      icon: api
  annotations:
    backstage.io/definition-at-location: file:./apis/remedy-notification-api.yaml
spec:
  type: openapi
  lifecycle: experimental
  owner: team-mnpt
  system: southdeep-products
  definition: |
    openapi: 3.0.0
    info:
      title: Remedy Notification API
      version: 1.0.0
      description: |
        API for handling remedy notifications with automatic email integration using Postie service.
        
        This API processes remedy notifications and automatically sends emails to customers based on notification type:
        - 'StatusChange' notifications use 'ticket-closure-notification' template
        - 'WorkOrderUpdate' notifications use 'ticket-response-notification' template
        
        Email integration uses Lowe's internal Postie service for reliable email delivery.
      contact:
        name: One-Ring Team
        email: saisidharth.giridharan@<url>.com
    servers:
      - url: <url>
        description: Stage Environment
      - url: <url>
        description: Production Environment
    paths:
      /remedy/notification:
        post:
          summary: Process remedy notification
          description: |
            Processes a remedy notification and automatically sends an email to the customer.
            
            The endpoint:
            1. Validates required fields (orderId, emailId, notificationType)
            2. Logs notification details for tracking
            3. Automatically sends email via Postie service based on notification type
            4. Returns processing status including email delivery status
          operationId: processRemedyNotification
          tags:
            - Remedy Notifications
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RemedyNotificationRequest'
                examples:
                  statusChangeNotification:
                    summary: Status change notification example
                    value:
                      orderId: "ORD-12345"
                      emailId: "customer@example.com"
                      notificationType: "StatusChange"
                      message: "Your order status has been updated"
                  workOrderUpdateNotification:
                    summary: Work order update notification example
                    value:
                      orderId: "ORD-67890"
                      emailId: "customer@example.com"
                      notificationType: "WorkOrderUpdate"
                      message: "Your work order has been updated"
          responses:
            '200':
              description: Notification processed successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/RemedyNotificationResponse'
                  examples:
                    successWithEmail:
                      summary: Successful processing with email sent
                      value:
                        success: true
                        message: "Remedy notification processed successfully"
                        data:
                          orderId: "ORD-12345"
                          emailId: "customer@example.com"
                          notificationType: "StatusChange"
                          processedAt: "2025-08-22T16:22:09.000Z"
                          email:
                            status: "sent"
                            messageId: "one-ring-1692713329000-abc123def"
                            error: null
                    successWithEmailError:
                      summary: Successful processing but email failed
                      value:
                        success: true
                        message: "Remedy notification processed successfully"
                        data:
                          orderId: "ORD-12345"
                          emailId: "customer@example.com"
                          notificationType: "StatusChange"
                          processedAt: "2025-08-22T16:22:09.000Z"
                          email:
                            status: "failed"
                            messageId: null
                            error: "Failed to send email: Connection timeout"
            '400':
              description: Bad request - missing required fields
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ErrorResponse'
                  example:
                    success: false
                    error: "Missing required fields: orderId, emailId, notificationType"
                    timestamp: "2025-08-22T16:22:09.000Z"
            '500':
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ErrorResponse'
                  example:
                    success: false
                    error: "Internal server error processing remedy notification"
                    timestamp: "2025-08-22T16:22:09.000Z"
    components:
      schemas:
        RemedyNotificationRequest:
          type: object
          required:
            - orderId
            - emailId
            - notificationType
          properties:
            orderId:
              type: string
              description: Unique identifier for the order
              example: "ORD-12345"
            emailId:
              type: string
              format: email
              description: Email address of the customer to notify
              example: "customer@example.com"
            notificationType:
              type: string
              enum: ["StatusChange", "WorkOrderUpdate"]
              description: |
                Type of notification being sent:
                - 'StatusChange': Order status has been changed (uses ticket-closure-notification template)
                - 'WorkOrderUpdate': Work order has been updated (uses ticket-response-notification template)
              example: "StatusChange"
            message:
              type: string
              description: Optional message content for the notification
              example: "Your order issue has been successfully resolved"
        RemedyNotificationResponse:
          type: object
          properties:
            success:
              type: boolean
              description: Whether the notification was processed successfully
              example: true
            message:
              type: string
              description: Human-readable message about the processing result
              example: "Remedy notification processed successfully"
            data:
              type: object
              properties:
                orderId:
                  type: string
                  description: The order ID that was processed
                  example: "ORD-12345"
                emailId:
                  type: string
                  format: email
                  description: The email address that was notified
                  example: "customer@example.com"
                notificationType:
                  type: string
                  description: The type of notification that was processed
                  example: "StatusChange"
                processedAt:
                  type: string
                  format: date-time
                  description: Timestamp when the notification was processed
                  example: "2025-08-22T16:22:09.000Z"
                email:
                  type: object
                  description: Email delivery status information
                  properties:
                    status:
                      type: string
                      enum: ["sent", "failed", "error", "skipped"]
                      description: |
                        Email delivery status:
                        - 'sent': Email was successfully sent via Postie
                        - 'failed': Email sending failed (Postie returned error)
                        - 'error': Exception occurred during email sending
                        - 'skipped': Email sending was skipped
                      example: "sent"
                    messageId:
                      type: string
                      nullable: true
                      description: Unique message ID from Postie service (if successful)
                      example: "one-ring-1692713329000-abc123def"
                    error:
                      type: string
                      nullable: true
                      description: Error message if email sending failed
                      example: null
        ErrorResponse:
          type: object
          properties:
            success:
              type: boolean
              description: Always false for error responses
              example: false
            error:
              type: string
              description: Error message describing what went wrong
              example: "Missing required fields: orderId, emailId, notificationType"
            timestamp:
              type: string
              format: date-time
              description: Timestamp when the error occurred
              example: "2025-08-22T16:22:09.000Z"
